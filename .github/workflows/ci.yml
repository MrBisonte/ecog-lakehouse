name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Data stays outside the checkout, as on a workstation.
      DATA_DIR: ${{ runner.temp }}/ecog-lakehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: make lint
      - run: make test
      # The whole pipeline on generated data, no download.
      - run: make all SYNTH=1

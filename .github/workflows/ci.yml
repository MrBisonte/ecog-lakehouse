name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DATA_DIR is the Makefile default, $HOME/data/ecog-lakehouse, outside the checkout.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # requirements.lock is pip freeze of the development environment, dev tools included.
      - run: pip install -r requirements.lock -e .
      - run: make lint
      - run: make test
      # The whole pipeline on generated data, no download.
      - run: make all SYNTH=1

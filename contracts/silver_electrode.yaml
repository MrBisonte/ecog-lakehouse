apiVersion: v3.0.1
kind: DataContract
id: silver-electrode
name: silver/electrode
version: 0.1.0
status: active
description:
  purpose: One row per electrode, pseudonymised. spec 3.2.
schema:
  - name: electrode
    physicalName: silver/electrode
    physicalType: parquet
    properties:
      - name: experiment
        logicalType: string
        physicalType: VARCHAR
        required: true
      - name: subject_pid
        logicalType: string
        physicalType: VARCHAR
        required: true
      - name: channel_idx
        logicalType: integer
        physicalType: SMALLINT
        required: true
      - name: x_mm
        logicalType: number
        physicalType: FLOAT
        required: false
      - name: y_mm
        logicalType: number
        physicalType: FLOAT
        required: false
      - name: z_mm
        logicalType: number
        physicalType: FLOAT
        required: false
      - name: brain_area
        logicalType: string
        physicalType: VARCHAR
        required: false
      - name: lid
        logicalType: string
        physicalType: UUID
        required: true
    quality:
      - type: custom
        engine: ecog-lakehouse
        implementation:
          check_kind: no_direct_identifier
          params: {"forbidden_columns": ["subject_src"]}

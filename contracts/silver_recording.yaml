apiVersion: v3.0.1
kind: DataContract
id: silver-recording
name: silver/recording
version: 0.1.0
status: active
description:
  purpose: One row per sample, microvolts and milliseconds, pseudonymised. spec 3.2 and 12.2.
schema:
  - name: recording
    physicalName: silver/recording
    physicalType: parquet
    properties:
      - name: experiment
        logicalType: string
        physicalType: VARCHAR
        required: true
      - name: subject_pid
        logicalType: string
        physicalType: VARCHAR
        required: true
      - name: run
        logicalType: integer
        physicalType: SMALLINT
        required: true
      - name: channel_idx
        logicalType: integer
        physicalType: SMALLINT
        required: true
      - name: ts_ms
        logicalType: integer
        physicalType: INTEGER
        required: true
        description: Milliseconds from the start of the run.
      - name: value_uv
        logicalType: number
        physicalType: FLOAT
        required: true
        description: Microvolts. A source NaN is dropped, never stored as NULL.
      - name: lid
        logicalType: string
        physicalType: UUID
        required: true
        description: The record this sample belongs to, layer 2.
      - name: sample_idx
        logicalType: integer
        physicalType: INTEGER
        required: true
    quality:
      - type: custom
        engine: ecog-lakehouse
        implementation:
          check_kind: row_count_min
          params: {"min": 1}
      - type: custom
        engine: ecog-lakehouse
        implementation:
          check_kind: no_direct_identifier
          params: {"forbidden_columns": ["subject_src"]}

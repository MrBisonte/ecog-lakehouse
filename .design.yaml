# The declaration of this repository for the design scan of arch-standards: the files to scan,
# their roles, and each line allowed to break a rule, with its reason. The scan is not part of
# this repository. It runs from a checkout of arch-standards, see README.md, "Design rules".

# The pipeline, its SQL, and the four planted faults with their fixes and benches.
sources:
  - pipeline/**/*.py
  - sql/**/*.sql
  - faults/**/*.py
  - faults/**/*.sql
  - faults/**/*.sh

# Generated by idgen of arch-standards and copied by `make lineage`, never edited here.
exclude:
  - sql/lineage/lid_generated.sql

# The one home of the tuning values of the pipeline.
settings:
  - pipeline/settings.py

# Every layer, every check and the Python around them decide a result. One engine, DuckDB.
semantic:
  - sql/**/*.sql
  - pipeline/**/*.py

# db.py opens the connection every script is handed. keyring.py opens keyring.duckdb, the one
# database outside the layers, and mints its secret. clock.py reads the wall clock. lid.py mints
# the ULID of an ingest and of a checks run.
edge:
  - pipeline/db.py
  - pipeline/keyring.py
  - pipeline/clock.py
  - pipeline/lid.py

exceptions:
  # The check generator parses a statement before any connection exists.
  - path: pipeline/checks.py
    rule: 10
    match: "duckdb.connect("
    reason: an engine in memory that holds no data, opened to parse generated SQL

  # The planted faults, doc/spec.md section 6. A plant is never fixed. Its fix is the text the
  # spec prints, run by the DuckDB CLI, which has no renderer to hand it a value.
  - path: faults/a/plant.sql
    rule: 1
    match: "ROW_GROUP_SIZE 100000000"
    reason: Fault A as planted, one row group for the whole file
  - path: faults/a/fix.sql
    rule: 1
    match: "PARQUET_VERSION v2"
    reason: the fix of Fault A as doc/spec.md section 6 prints it, run by the DuckDB CLI
  - path: faults/a/fix.sql
    rule: 1
    match: "ROW_GROUP_SIZE 198656"
    reason: the fix of Fault A as doc/spec.md section 6 prints it, run by the DuckDB CLI
  - path: faults/a/encodings.py
    rule: 1
    match: "ROW_GROUP_SIZE 198656"
    reason: a measurement of the fixed layout of Fault A, at the row group size of faults/a/fix.sql
  - path: faults/d/plant.py
    rule: 1
    match: "timeout=60"
    reason: Fault D as planted, a first script with its values written in place
  - path: faults/f/flaky_proxy.py
    rule: 1
    match: "timeout=60"
    reason: the proxy that plants Fault F, a bench fixture outside the pipeline

  # A bench measures an engine it opens itself.
  - path: faults/a/http_stats.py
    rule: 10
    match: "duckdb.connect("
    reason: a bench script that runs one EXPLAIN ANALYZE on its own engine in memory
  - path: faults/f/bench.sh
    rule: 10
    match: "duckdb.connect("
    reason: Fault F times ten attempts, each on a fresh engine in memory

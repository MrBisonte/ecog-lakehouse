[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecog-lakehouse"
version = "0.0.1"
description = "Governed lakehouse over public ECoG recordings with planted performance faults"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "Alexandre Monteiro" }]
dependencies = ["duckdb>=1.4", "scipy>=1.13", "numpy>=1.26", "pyyaml>=6"]

[project.urls]
Repository = "https://github.com/MrBisonte/ecog-lakehouse"
Site = "https://mrbisonte.github.io/ecog-lakehouse/"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "cyclonedx-bom>=7"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

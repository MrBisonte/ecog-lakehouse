[project]
name = "ecog-lakehouse"
version = "0.0.1"
description = "Governed lakehouse over public ECoG recordings with planted performance faults"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.4", "scipy>=1.13", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
